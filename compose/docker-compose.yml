name: compose

services:
  mysql:
    image: mysql:5.7.44
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in /data/software/compose/.env}"
      MYSQL_LOWER_CASE_TABLE_NAMES: "1"
      TZ: Asia/Shanghai
    ports:
      - "53306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/config/my.cnf:/etc/mysql/my.cnf
      - ./mysql/logs:/var/log/mysql
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - blog-network

  nginx:
    image: nginx:1.27.0
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
    networks:
      - blog-network

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    image: typecho-php:7.4
    container_name: typecho-php
    command: ["php-fpm"]
    restart: unless-stopped
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./php/config.inc.php:/usr/share/nginx/html/config.inc.php:ro
      - ./php/php.ini:/usr/local/etc/php/conf.d/typecho.ini:ro
    networks:
      blog-network:
        aliases:
          - typecho-php

networks:
  blog-network:
    name: compose_blog-network
    driver: bridge

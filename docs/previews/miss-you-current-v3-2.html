body {
  background: #f7f5ee;
  color: #283b34;
}
.life-page {
  padding: 16.64px 20.8px 33.28px;
  min-height: 100vh;
  box-sizing: border-box;
}
.life-eyebrow {
  font-size: 11.44px;
  letter-spacing: 1.56px;
  color: #798279;
}
.life-title {
  font-size: 28.08px;
  line-height: 1.4;
  font-weight: 500;
  font-family: Georgia, 'Songti SC', serif;
  margin: 8.32px 0 12.48px;
}
.life-subtitle {
  font-size: 12.48px;
  color: #798279;
  line-height: 1.7;
}
.life-card {
  background: #fffef9;
  border-radius: 16.64px;
  padding: 14.56px;
  margin: 10.4px 0;
}
.life-hero {
  background: #e7ecdd;
  border-radius: 20.8px;
  padding: 20.8px;
  margin: 16.64px 0;
}
.life-number {
  font-family: Georgia, serif;
  font-size: 56.16px;
  line-height: 1.3;
  color: #42664f;
}
.life-number span {
  font-family: sans-serif;
  font-size: 13.52px;
  margin-left: 6.24px;
}
.life-heading {
  font-size: 17.68px;
  font-weight: 500;
  margin: 18.72px 0 10.4px;
}
.life-button {
  background: #42664f;
  color: #fff;
  border: 0;
  border-radius: 11.44px;
  font-size: 13.52px;
  padding: 9.36px 14.56px;
  line-height: 1.6;
  margin: 0;
}
.life-button::after {
  border: 0;
}
.life-link {
  color: #42664f;
  font-size: 12.48px;
  padding: 8.32px 0;
}
.life-event {
  display: flex;
  justify-content: space-between;
  gap: 10.4px;
  align-items: center;
  background: #fffef9;
  border-radius: 14.56px;
  padding: 13.52px;
  margin: 9.36px 0;
}
.life-date {
  background: #f7f5ee;
  border-radius: 9.36px;
  min-width: 37.44px;
  text-align: center;
  padding: 5.2px;
  font:
    19.76px Georgia,
    serif;
}
.life-date span {
  display: block;
  font: 10.4px sans-serif;
  color: #798279;
}
.life-event-copy {
  flex: 1;
}
.life-count {
  color: #b97461;
  font-size: 14.56px;
}
.life-photo {
  display: block;
  width: 100%;
  border-radius: 13.52px;
  background: #e7ecdd;
}
.life-input {
  background: #fffef9;
  border: 0.52px solid #e5e6dc;
  padding: 12.48px;
  border-radius: 10.4px;
  margin: 6.24px 0 14.56px;
  box-sizing: border-box;
  width: 100%;
  min-height: 46.8px;
  font-size: 15.6px;
}
.life-label {
  font-size: 13.52px;
  color: #798279;
  margin-top: 13.52px;
}

  padding: 31.2px 10.4px;
  text-align: center;
  color: #798279;
  line-height: 1.8;
}

  align-items: center;
  gap: 8.32px;
}

  color: #a44839;
  padding: 12.48px 0;
}
.btn,
.fab {
  background: #42664f;
}
.btn.secondary {
  background: #e7ecdd;
  color: #42664f;
}

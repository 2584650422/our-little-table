apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: business-https
  namespace: homelab
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - imlyc.cn
    - www.imlyc.cn
    - aaa.imlyc.cn
    - ssl.imlyc.cn
  rules:
    - backendRefs:
        - name: business-nginx
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: business-http-redirect
  namespace: homelab
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
  hostnames:
    - imlyc.cn
    - www.imlyc.cn
    - aaa.imlyc.cn
    - ssl.imlyc.cn
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

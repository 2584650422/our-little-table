services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: little-table-api:latest
    container_name: little-table-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: "3000"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      DEV_LOGIN_ENABLED: "false"
    expose:
      - "3000"
    networks:
      - blog
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=4)
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  blog:
    external: true
    name: compose_blog-network
